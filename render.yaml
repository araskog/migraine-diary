services:
  - type: web
    name: migraine-diary
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: python -m pip install uv==0.13.7 && sh scripts/render-build.sh
    startCommand: cd backend && DATABASE_URL="$DATABASE_URL_UNPOOLED" .venv/bin/python manage.py migrate --noinput && exec .venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.18
      - key: NODE_VERSION
        value: '24'
      - key: DJANGO_SETTINGS_MODULE
        value: config.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
