[project]
name = "migraine-diary-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["ruff>=0.14,<0.15"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I"]
